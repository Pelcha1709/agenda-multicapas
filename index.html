<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda Multicapas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="container">
    <h1>Agenda Multicapas</h1>

    <!-- Formulario contactos -->
    <section class="card">
      <h2>Nuevo Contacto</h2>
      <form id="contactForm">
        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" required placeholder="Ej. Juan">
        </div>
        <div class="form-group">
          <label for="apellido">Apellido</label>
          <input type="text" id="apellido" name="apellido" required placeholder="Ej. Pérez">
        </div>
        <div class="form-group">
          <label for="telefono">Teléfono</label>
          <input type="tel" id="telefono" name="telefono" required placeholder="Ej. 8095550199">
        </div>
        <div class="form-actions">
          <button type="submit" id="submitBtn">Guardar Contacto</button>
        </div>
      </form>
      <div id="statusMessage" role="alert"></div>
    </section>

    <!-- contactos -->
    <section class="card">
      <div class="contact-list-header">
        <h2>Listado de Contactos</h2>
        <button id="refreshBtn" type="button">Actualizar</button>
      </div>
      <div id="contactsContainer" class="contact-grid">
        <div class="empty-state">Cargando contactos...</div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
